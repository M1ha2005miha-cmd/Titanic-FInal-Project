data:
    training_path: data/train.csv
    test_path: data/test.csv

features:
    drop: ["PassengerId", "Ticket", "Name", "Cabin"]
    numeric: ["Age", "SibSp", "Parch", "Fare", "FamilySize", "HasCabin"]
    categorical: ["Sex", "Embarked", "Title", "FamilyGroup", "Pclass"]

validation:
    n_splits: 5
    random_state: 42
    metrics: ["accuracy", "precision", "recall", "f1", "roc_auc"]

output:
    results_path: outputs/results.csv

tuning:
    logistic_regression:
        model__C: [0.01, 0.1, 1, 10]
    random_forest:
        model__max_depth: [4, 6, 8, null]
        model__min_samples_leaf: [1, 3, 5]
    lightgbm:
        model__n_estimators: [50, 100, 200]
        model__learning_rate: [0.05, 0.1]
        model__num_leaves: [3, 5, 7]      
