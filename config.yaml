data:
    training_path: data/train.csv
    test_path: data/test.csv

features:
    drop: ["PassengerId", "Ticket", "Name", "Cabin"]
    numeric: ["Age", "SibSp", "Parch", "Fare", "FamilySize", "HasCabin"]
    categorical: ["Sex", "Embarked", "Title", "FamilyGroup", "Pclass"]

validation:
    n_splits: 5
    random_state: 42
    metrics: ["accuracy", "precision", "recall", "f1", "roc_auc"]

